.actor,.limb,.prop,.accent,.eyes{transform-box:view-box}
.actor{transform-origin:80px 150px;animation:act 8s ease-in-out infinite}
.prop{transform-origin:80px 136px;animation:prop-act 8s ease-in-out infinite}
.accent{animation:accent-act 8s ease-in-out infinite}
.eyes{transform-origin:80px 80px;animation:blink 8s linear infinite}
.pose-type .limb{animation:typing 8s linear infinite}.pose-type .limb-1{animation-name:typing-right}
.pose-kick .limb,.pose-flail .limb{animation:fuss 8s ease-in-out infinite}
@keyframes act{0%,25%,50%,75%,100%{translate:0 0}10%,35%,60%,85%{translate:0 -2px}20%,45%,70%,95%{translate:0 1px}}
@keyframes prop-act{0%,25%,50%,75%,100%{translate:0 0}12%,37%,62%,87%{translate:0 -2px}22%,47%,72%,97%{translate:1px 1px}}
