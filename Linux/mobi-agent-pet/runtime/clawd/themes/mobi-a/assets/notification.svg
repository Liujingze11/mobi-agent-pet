<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 180" role="img" aria-labelledby="title description">
<title id="title">莫比 · 等待回复</title>
<desc id="description">歪头疑惑地等待，抬近手机时睁大眼睛、抬眉微张嘴；右手始终握住手机，拇指轻点一下后再放下等待。问号轻轻出现，手机和手同步移动。完整循环 5 秒。</desc>
<style>.stage-0{opacity:1;animation:beat-0 5s linear infinite}@keyframes beat-0{0%,24.99%{opacity:1}25%,99.99%{opacity:0}100%{opacity:1}}
.stage-1{opacity:0;animation:beat-1 5s linear infinite}@keyframes beat-1{0%,24.99%{opacity:0}25%,49.99%{opacity:1}50%,100%{opacity:0}}
.stage-2{opacity:0;animation:beat-2 5s linear infinite}@keyframes beat-2{0%,49.99%{opacity:0}50%,74.99%{opacity:1}75%,100%{opacity:0}}
.stage-3{opacity:0;animation:beat-3 5s linear infinite}@keyframes beat-3{0%,74.99%{opacity:0}75%,99.99%{opacity:1}100%,100%{opacity:0}}
.phone-wait-actor{animation:phone-wait-breathe 5s ease-in-out infinite}
.phone-arm-right,.phone-hand-right,.phone-thumb,.phone-wait-head,.eyes{transform-box:view-box}
.phone-arm-right{transform-origin:97px 115px;animation:phone-wait-arm 5s ease-in-out infinite}
.phone-hand-right{transform-origin:114px 134px;animation:phone-wait-hold 5s ease-in-out infinite}
.phone-thumb{transform-origin:114px 134px;animation:phone-wait-tap 5s ease-in-out infinite}
.phone-wait-head{transform-origin:80px 105px;animation:phone-wait-look 5s ease-in-out infinite}
.eyes{transform-origin:80px 78px;animation:phone-wait-gaze 5s ease-in-out infinite,phone-wait-blink 5s linear infinite}
.accent-question{animation:phone-wait-question 5s ease-in-out infinite}
.waiting-dot{animation:phone-wait-dot 5s linear infinite}
@keyframes phone-wait-breathe{0%,14%,78%,100%{translate:0 0}30%,60%{translate:0 -1px}}
@keyframes phone-wait-arm{0%{scale:1 1}14%{scale:1 1}30%{scale:0.8235294117647058 0.3684210526315789}60%{scale:0.8235294117647058 0.3684210526315789}78%{scale:1 1}100%{scale:1 1}}
@keyframes phone-wait-hold{0%{translate:0px 0px;rotate:0deg}14%{translate:0px 0px;rotate:0deg}30%{translate:-3px -12px;rotate:-7deg}60%{translate:-3px -12px;rotate:-7deg}78%{translate:0px 0px;rotate:0deg}100%{translate:0px 0px;rotate:0deg}}
@keyframes phone-wait-tap{0%,43%,56%,100%{rotate:0deg}49%{rotate:14deg}}
@keyframes phone-wait-look{0%,14%,78%,100%{rotate:-2deg}30%,60%{rotate:5deg}}
@keyframes phone-wait-gaze{0%,14%,78%,100%{translate:0 0}30%,60%{translate:3px 1px}}
@keyframes phone-wait-blink{0%,17%,20%,83%,86%,100%{scale:1 1}18%,19%,84%,85%{scale:1 .12}}
@keyframes phone-wait-question{0%,14%,85%,100%{opacity:.75}30%,65%{opacity:0}}
@keyframes phone-wait-dot{0%,20%,78%,100%{opacity:.45}36%,60%{opacity:1}}
@media(prefers-reduced-motion:reduce){.stage,.phone-wait-actor,.phone-arm-right,.phone-hand-right,.phone-thumb,.phone-wait-head,.eyes,.accent-question,.waiting-dot{animation:none}}
</style>
<g fill="#fffef9" stroke="#242424" stroke-width="4.2" stroke-linejoin="round" stroke-linecap="round" id="body-js">
<g class="phone-wait-actor"><path d="M69 145 L65 163 L57 163 M91 145 L95 163 L104 163" fill="none"/><path d="M65 106 Q58 118 60 143 Q60 149 70 148 L91 148 Q101 149 101 140 Q101 119 95 107 Z" /><g class="phone-arm-left"><path d="M63 115 Q46 124 48 137" fill="none"/></g><g class="phone-arm-right"><path d="M97 115 Q111 128 114 134" fill="none"/></g><g class="phone-wait-head"><g class="stage stage-0" aria-label="疑惑地等待回复"><path d="M53 28 Q37 27 37 46 L38 95 Q37 113 54 113 L105 112 Q123 112 122 94 L122 45 Q121 28 105 29 Z" /><g id="eyes-js" class="eyes"><ellipse cx="60" cy="78" rx="5.8" ry="6.6"/><ellipse cx="100" cy="78" rx="6.6" ry="7.4"/><circle cx="60" cy="78" r="2.3" fill="#242424" stroke="none"/><circle cx="100" cy="78" r="2.3" fill="#242424" stroke="none"/></g><g stroke-width="2.8"><path d="M52 67 Q60 62 68 65 M92 61 Q100 57 108 62" fill="none"/></g><g stroke-width="3"><ellipse cx="81" cy="99" rx="3.3" ry="4.3" transform="rotate(-10 81 99)"/></g><path d="M45 64 L49 59" fill="none"/></g><g class="stage stage-1" aria-label="惊讶地查看手机"><path d="M53 28 Q37 27 37 46 L38 95 Q37 113 54 113 L105 112 Q123 112 122 94 L122 45 Q121 28 105 29 Z" /><g class="eyes"><circle cx="60" cy="78" r="7.5"/><circle cx="100" cy="78" r="7.5"/><circle cx="60" cy="78" r="2.4" fill="#242424" stroke="none"/><circle cx="100" cy="78" r="2.4" fill="#242424" stroke="none"/></g><g stroke-width="2.8"><path d="M51 62 Q60 55 69 60 M91 59 Q100 53 109 60" fill="none"/></g><g stroke-width="3"><ellipse cx="80" cy="99" rx="4.5" ry="6.2"/></g><path d="M45 64 L49 59" fill="none"/></g><g class="stage stage-2" aria-label="惊讶地查看手机"><path d="M53 28 Q37 27 37 46 L38 95 Q37 113 54 113 L105 112 Q123 112 122 94 L122 45 Q121 28 105 29 Z" /><g class="eyes"><circle cx="60" cy="78" r="7.5"/><circle cx="100" cy="78" r="7.5"/><circle cx="60" cy="78" r="2.4" fill="#242424" stroke="none"/><circle cx="100" cy="78" r="2.4" fill="#242424" stroke="none"/></g><g stroke-width="2.8"><path d="M51 62 Q60 55 69 60 M91 59 Q100 53 109 60" fill="none"/></g><g stroke-width="3"><ellipse cx="80" cy="99" rx="4.5" ry="6.2"/></g><path d="M45 64 L49 59" fill="none"/></g><g class="stage stage-3" aria-label="疑惑地等待回复"><path d="M53 28 Q37 27 37 46 L38 95 Q37 113 54 113 L105 112 Q123 112 122 94 L122 45 Q121 28 105 29 Z" /><g class="eyes"><ellipse cx="60" cy="78" rx="5.8" ry="6.6"/><ellipse cx="100" cy="78" rx="6.6" ry="7.4"/><circle cx="60" cy="78" r="2.3" fill="#242424" stroke="none"/><circle cx="100" cy="78" r="2.3" fill="#242424" stroke="none"/></g><g stroke-width="2.8"><path d="M52 67 Q60 62 68 65 M92 61 Q100 57 108 62" fill="none"/></g><g stroke-width="3"><ellipse cx="81" cy="99" rx="3.3" ry="4.3" transform="rotate(-10 81 99)"/></g><path d="M45 64 L49 59" fill="none"/></g></g><g class="phone-hand-right"><g class="held-phone" stroke-width="2.8"><rect x="113" y="107" width="23" height="39" rx="4.5"/><rect x="117" y="113" width="15" height="24" rx="2"/><g stroke-width="1.2"><path d="M121 110 H127" fill="none"/></g><circle cx="124.5" cy="142" r="1.2" fill="#242424" stroke="none"/><circle class="waiting-dot" cx="120.5" cy="125" r="1.15" fill="#65727d" stroke="none"/><circle class="waiting-dot" cx="124.5" cy="125" r="1.15" fill="#65727d" stroke="none"/><circle class="waiting-dot" cx="128.5" cy="125" r="1.15" fill="#65727d" stroke="none"/></g><g class="phone-grip" transform="translate(114 134)" stroke-width="2.8"><path d="M-4 -2 Q-8 -4 -6 -8 Q-4 -10 -2 -7 L1 -3 L4 -5 Q7 -5 7 -2 L5 3 Q2 7 -3 4 Q-6 3 -4 -2 Z" /></g><g class="phone-thumb"><path d="M113 135 Q117 129 120 129 Q123 130 120 133 L117 137" stroke-width="2.4"/></g></g><g class="phone-hand-left"><g class="juggle-hand" transform="translate(48 137) scale(1 1)" stroke-width="3.2"><path d="M-5 1 Q-8 -4 -4 -6 Q-1 -7 0 -3 Q3 -6 6 -3 Q9 1 5 5 Q0 8 -4 5 Z" /><g stroke-width="1.6"><path d="M-2 2 Q1 0 4 2" fill="none"/></g></g></g><g class="accent accent-question" stroke-width="2.6"><path d="M129 24 Q129 16 136 18 Q146 21 135 30 V33" fill="none"/><circle cx="135" cy="39" r="1.8" fill="#242424" stroke="none"/></g></g>
</g>
</svg>
