<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 180" role="img" aria-labelledby="title description">
<title id="title">莫比 · 整屏彩纸雨</title>
<desc id="description">右手握住礼花筒，左手向左下方拉开拉绳，彩纸从显示器顶部进入，由上往下铺满整个屏幕；随后开心举手连跳八下，跳跃持续约六秒，最后回到起始姿势；完整循环 8 秒。</desc>
<style>.party-actor{animation:party-jump 8s ease-in-out infinite}
.party-arm,.party-leg,.eyes,.confetti{transform-box:view-box}
.party-arm-left{transform-origin:63px 115px;animation:party-left-arm 8s ease-in-out infinite}
.party-arm-right{transform-origin:97px 115px;animation:party-right-arm 8s ease-in-out infinite}
.party-hand-left{animation:party-left-hand 8s ease-in-out infinite}
.party-hand-right{animation:party-right-hand 8s ease-in-out infinite}
.party-pull-cord{transform-box:view-box;transform-origin:114px 135px;animation:party-pull 8s ease-in-out infinite,party-cord-visible 8s linear infinite}
.party-loose-cord{opacity:0;animation:party-loose-visible 8s linear infinite}
.party-leg-left{transform-origin:69px 145px;animation:party-kick 8s ease-in-out infinite}
.party-leg-right{transform-origin:91px 145px;animation:party-kick-right 8s ease-in-out infinite}
.eyes{transform-origin:80px 78px;animation:party-blink 8s linear infinite}
.confetti{opacity:0;transform-origin:132px 108px}
@keyframes party-jump{0%{translate:0 0}15%{translate:0 0}16.2%{translate:0 2px}19.3%{translate:0 -14px}23%{translate:0 0}24.375%{translate:0 0}25.575%{translate:0 2px}28.675%{translate:0 -14px}32.375%{translate:0 0}33.75%{translate:0 0}34.95%{translate:0 2px}38.05%{translate:0 -14px}41.75%{translate:0 0}43.125%{translate:0 0}44.325%{translate:0 2px}47.425%{translate:0 -14px}51.125%{translate:0 0}52.5%{translate:0 0}53.7%{translate:0 2px}56.8%{translate:0 -14px}60.5%{translate:0 0}61.875%{translate:0 0}63.075%{translate:0 2px}66.175%{translate:0 -14px}69.875%{translate:0 0}71.25%{translate:0 0}72.45%{translate:0 2px}75.55%{translate:0 -14px}79.25%{translate:0 0}80.625%{translate:0 0}81.825%{translate:0 2px}84.925%{translate:0 -14px}88.625%{translate:0 0}90%,100%{translate:0 0}}
@keyframes party-left-arm{0%{scale:1 1}2.5%{scale:1 1}10%{scale:0.5625 1.36}12.5%{scale:0.5625 1.36}18.75%{scale:-0.6458333333333334 -0.8}90%{scale:-0.6458333333333334 -0.8}97%{scale:1 1}100%{scale:1 1}}
@keyframes party-right-arm{0%{scale:1 1}12.5%{scale:1 1}18.75%{scale:1.7222222222222223 -1.176470588235294}90%{scale:1.7222222222222223 -1.176470588235294}97%{scale:1 1}100%{scale:1 1}}
@keyframes party-left-hand{0%{translate:0px 0px}2.5%{translate:0px 0px}10%{translate:-21px 9px}12.5%{translate:-21px 9px}18.75%{translate:-79px -45px}90%{translate:-79px -45px}97%{translate:0px 0px}100%{translate:0px 0px}}
@keyframes party-right-hand{0%{translate:0px 0px}12.5%{translate:0px 0px}18.75%{translate:13px -37px}90%{translate:13px -37px}97%{translate:0px 0px}100%{translate:0px 0px}}
@keyframes party-pull{0%{scale:1 1}2.5%{scale:1 1}10%{scale:8 2.8}12.5%{scale:8 2.8}97%{scale:1 1}100%{scale:1 1}}
@keyframes party-cord-visible{0%,12.5%,97%,100%{opacity:1}12.51%,96.99%{opacity:0}}
@keyframes party-loose-visible{0%,12.5%,97%,100%{opacity:0}12.51%,96.99%{opacity:1}}
@keyframes party-kick{0%{rotate:0deg}15%{rotate:0deg}19.3%{rotate:13deg}23%{rotate:0deg}24.375%{rotate:0deg}28.675%{rotate:13deg}32.375%{rotate:0deg}33.75%{rotate:0deg}38.05%{rotate:13deg}41.75%{rotate:0deg}43.125%{rotate:0deg}47.425%{rotate:13deg}51.125%{rotate:0deg}52.5%{rotate:0deg}56.8%{rotate:13deg}60.5%{rotate:0deg}61.875%{rotate:0deg}66.175%{rotate:13deg}69.875%{rotate:0deg}71.25%{rotate:0deg}75.55%{rotate:13deg}79.25%{rotate:0deg}80.625%{rotate:0deg}84.925%{rotate:13deg}88.625%{rotate:0deg}90%,100%{rotate:0deg}}
@keyframes party-kick-right{0%{rotate:0deg}15%{rotate:0deg}19.3%{rotate:-13deg}23%{rotate:0deg}24.375%{rotate:0deg}28.675%{rotate:-13deg}32.375%{rotate:0deg}33.75%{rotate:0deg}38.05%{rotate:-13deg}41.75%{rotate:0deg}43.125%{rotate:0deg}47.425%{rotate:-13deg}51.125%{rotate:0deg}52.5%{rotate:0deg}56.8%{rotate:-13deg}60.5%{rotate:0deg}61.875%{rotate:0deg}66.175%{rotate:-13deg}69.875%{rotate:0deg}71.25%{rotate:0deg}75.55%{rotate:-13deg}79.25%{rotate:0deg}80.625%{rotate:0deg}84.925%{rotate:-13deg}88.625%{rotate:0deg}90%,100%{rotate:0deg}}
@keyframes party-blink{0%,18%,21%,43%,46%,68%,71%,93%,96%,100%{scale:1 1}19%,20%,44%,45%,69%,70%,94%,95%{scale:1 .12}}

@media(prefers-reduced-motion:reduce){.party-actor,.party-arm,.party-hand-left,.party-hand-right,.party-leg,.party-pull-cord,.party-loose-cord,.eyes,.confetti{animation:none}.confetti,.party-loose-cord{opacity:0}}
</style>
<g fill="#fffef9" stroke="#242424" stroke-width="4.2" stroke-linejoin="round" stroke-linecap="round" id="body-js">
<g class="party-actor"><g class="party-leg party-leg-left"><path d="M69 145 L65 163 L57 163" fill="none"/></g><g class="party-leg party-leg-right"><path d="M91 145 L95 163 L104 163" fill="none"/></g><path d="M65 106 Q58 118 60 143 Q60 149 70 148 L91 148 Q101 149 101 140 Q101 119 95 107 Z" /><g class="party-arm party-arm-left"><path d="M63 115 Q81 130 111 140" fill="none"/></g><g class="party-arm party-arm-right"><path d="M97 115 Q118 125 115 132" fill="none"/></g><path d="M53 28 Q37 27 37 46 L38 95 Q37 113 54 113 L105 112 Q123 112 122 94 L122 45 Q121 28 105 29 Z" /><g id="eyes-js" class="eyes"><path d="M53 80 Q60 69 67 80 M93 80 Q100 69 107 80" fill="none"/></g><g stroke-width="2.8"></g><g stroke-width="3"><path d="M71 97 Q80 109 89 97" fill="none"/></g><path d="M45 64 L49 59" fill="none"/><path d="M114 135 Q112 137 111 140" class="party-pull-cord" fill="none" stroke-width="1.8" vector-effect="non-scaling-stroke"/><g class="party-hand party-hand-left"><g class="juggle-hand" transform="translate(111 140) scale(1 1)" stroke-width="3.2"><path d="M-5 1 Q-8 -4 -4 -6 Q-1 -7 0 -3 Q3 -6 6 -3 Q9 1 5 5 Q0 8 -4 5 Z" /><g stroke-width="1.6"><path d="M-2 2 Q1 0 4 2" fill="none"/></g></g></g><g class="party-hand party-hand-right"><g class="party-popper" stroke-width="2.2"><path d="M114 135 L125 103 Q136 101 140 113 Z" fill="#efbb9b"/><g stroke="#efc05c" stroke-width="3"><path d="M119 123 L128 130 M122 115 L134 122" fill="none"/></g><ellipse cx="132" cy="108" rx="9" ry="4" transform="rotate(35 132 108)" fill="#f5d784"/><path d="M114 135 Q112 141 116 145 Q120 146 119 142" class="party-loose-cord" fill="none" stroke-width="1.3"/></g><g class="juggle-hand" transform="translate(115 132) scale(-1 1)" stroke-width="3.2"><path d="M-5 1 Q-8 -4 -4 -6 Q-1 -7 0 -3 Q3 -6 6 -3 Q9 1 5 5 Q0 8 -4 5 Z" /><g stroke-width="1.6"><path d="M-2 2 Q1 0 4 2" fill="none"/></g></g></g></g>

</g>
</svg>
