<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 180" role="img" aria-labelledby="title description">
<title id="title">莫比 · 搭建积木城堡</title>
<desc id="description">摆好城门底座，搭起两侧塔楼，放上城垛，展示完整的积木城堡；完整循环 6 秒。</desc>
<style>.stage-0{opacity:1;animation:beat-0 6s linear infinite}@keyframes beat-0{0%,24.99%{opacity:1}25%,99.99%{opacity:0}100%{opacity:1}}
.stage-1{opacity:0;animation:beat-1 6s linear infinite}@keyframes beat-1{0%,24.99%{opacity:0}25%,49.99%{opacity:1}50%,100%{opacity:0}}
.stage-2{opacity:0;animation:beat-2 6s linear infinite}@keyframes beat-2{0%,49.99%{opacity:0}50%,74.99%{opacity:1}75%,100%{opacity:0}}
.stage-3{opacity:0;animation:beat-3 6s linear infinite}@keyframes beat-3{0%,74.99%{opacity:0}75%,99.99%{opacity:1}100%,100%{opacity:0}}
.castle-builder.actor{animation:castle-bob 6s ease-in-out infinite}
.eyes{transform-box:view-box;transform-origin:80px 80px;animation:castle-blink 6s linear infinite}
.castle-arm{transform-box:view-box;transform-origin:79px 115px;animation:castle-place 6s ease-in-out infinite,castle-bob 6s ease-in-out infinite}
.stage-2 .castle-arm{animation-name:castle-place-right,castle-bob}
.castle-carried{animation:castle-release 6s linear infinite}
.castle-deposited{animation:castle-settled 6s linear infinite}
.castle-flag{animation:castle-finish 6s linear infinite}
@keyframes castle-bob{0%,25%,50%,75%,100%{translate:0 0}12%,37%,62%{translate:0 1px}}
@keyframes castle-blink{0%,18%,21%,43%,46%,68%,71%,93%,96%,100%{scale:1 1}19%,20%,44%,45%,69%,70%,94%,95%{scale:1 .12}}
@keyframes castle-place{0%,25%,50%,75%,100%{rotate:-32deg}15%,40%,65%,90%,99.99%{rotate:0deg}}
@keyframes castle-place-right{0%,25%,50%,75%,100%{rotate:-16deg}15%,40%,65%,90%,99.99%{rotate:0deg}}
@keyframes castle-release{0%,14.99%,25%,39.99%,50%,64.99%,75%,89.99%,100%{opacity:1}15%,24.99%,40%,49.99%,65%,74.99%,90%,99.99%{opacity:0}}
@keyframes castle-settled{0%,14.99%,25%,39.99%,50%,64.99%,75%,89.99%,100%{opacity:0}15%,24.99%,40%,49.99%,65%,74.99%,90%,99.99%{opacity:1}}
@keyframes castle-finish{0%,89.99%,100%{opacity:0}90%,99.99%{opacity:1}}
@media(prefers-reduced-motion:reduce){.stage{animation:none;opacity:0}.stage-3{opacity:1}.eyes{animation:none}.castle-arm,.castle-builder.actor{animation:none;rotate:0deg}.castle-carried{animation:none;opacity:0}.castle-deposited,.castle-flag{animation:none;opacity:1}}
</style>
