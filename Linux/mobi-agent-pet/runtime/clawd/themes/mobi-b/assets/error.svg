<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 180" role="img" aria-labelledby="title description">
<title id="title">莫莫 · 突然来活</title>
<desc id="description">正在喝咖啡，电脑突然从右侧飞来；放下杯子并伸手接住，随后左手托着电脑、右手敲键盘。喝咖啡、接电脑、敲键盘各约 2.5 秒，整轮 7.5 秒。</desc>
<style>.stage-0{opacity:1;animation:beat-0 7.5s step-end infinite}@keyframes beat-0{0%{opacity:1}33.333333%,100%{opacity:0}}
.stage-1{opacity:0;animation:beat-1 7.5s step-end infinite}@keyframes beat-1{0%{opacity:0}33.333333%{opacity:1}66.666666%{opacity:0}100%{opacity:0}}
.stage-2{opacity:0;animation:beat-2 7.5s step-end infinite}@keyframes beat-2{0%{opacity:0}66.666666%{opacity:1}100%{opacity:0}}
.interrupt-arm,.interrupt-hand,.interrupt-cup,.interrupt-laptop,.interrupt-head,.eyes{transform-box:view-box}
.interrupt-arm-left{animation:interrupt-left-arm 7.5s linear infinite}
.interrupt-arm-right{animation:interrupt-right-arm 7.5s linear infinite}
.interrupt-hand-left{animation:interrupt-left-hand 7.5s linear infinite}
.interrupt-hand-right{animation:interrupt-right-hand 7.5s linear infinite}
.interrupt-cup{animation:interrupt-cup 7.5s linear infinite}
.interrupt-cup-tilt{transform-origin:0 0;animation:interrupt-sip 7.5s ease-in-out infinite}
.interrupt-steam{animation:interrupt-steam 7.5s linear infinite}
.interrupt-laptop{transform-origin:80px 145px;animation:interrupt-laptop 7.5s linear infinite,interrupt-laptop-visible 7.5s step-end infinite;opacity:0}
.interrupt-head{transform-origin:80px 104px;animation:interrupt-head 7.5s ease-in-out infinite}
.eyes{transform-origin:80px 78px;animation:interrupt-blink 7.5s linear infinite}
.stage-1 .eyes{translate:3px 2px}.stage-2 .eyes{translate:1px 3px}
.interrupt-code{transform-box:view-box;transform-origin:60px 130px;animation:interrupt-code 7.5s linear infinite}
.interrupt-cursor{animation:interrupt-cursor 7.5s step-end infinite}
.interrupt-key{animation:interrupt-key 7.5s step-end infinite}
