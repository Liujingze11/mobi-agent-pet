@keyframes interrupt-right-arm{0%{d:path("M97 115 Q113 126 113 137")}29%{d:path("M97 115 Q113 126 113 137")}33.333333%{d:path("M97 115 Q116.5 120 120 125")}38%{d:path("M97 115 Q122 118 131 121")}42%{d:path("M97 115 Q124.5 121.5 136 128")}44%{d:path("M97 115 Q122 126.5 131 138")}46%{d:path("M97 115 Q123 129 133 143")}49%{d:path("M97 115 Q121.5 127.5 130 140")}54%{d:path("M97 115 Q116 134.5 119 154")}60%{d:path("M97 115 Q106 134.5 99 154")}66.666666%{d:path("M97 115 Q104.5 134.5 96 154")}68%{d:path("M97 115 Q104.5 133 96 151")}70%{d:path("M97 115 Q104.5 134.5 96 154")}72%{d:path("M97 115 Q104.5 133 96 151")}74%{d:path("M97 115 Q104.5 134.5 96 154")}76%{d:path("M97 115 Q104.5 133 96 151")}78%{d:path("M97 115 Q104.5 134.5 96 154")}80%{d:path("M97 115 Q104.5 133 96 151")}82%{d:path("M97 115 Q104.5 134.5 96 154")}84%{d:path("M97 115 Q104.5 133 96 151")}86%{d:path("M97 115 Q104.5 134.5 96 154")}88%{d:path("M97 115 Q104.5 133 96 151")}90%{d:path("M97 115 Q104.5 134.5 96 154")}92%{d:path("M97 115 Q104.5 133 96 151")}94%{d:path("M97 115 Q104.5 134.5 96 154")}96%{d:path("M97 115 Q104.5 133 96 151")}98%{d:path("M97 115 Q104.5 134.5 96 154")}100%{d:path("M97 115 Q104.5 134.5 96 154")}}
@keyframes interrupt-left-hand{0%{translate:0px 0px}6%{translate:0px 0px}12%{translate:1px -3px}21%{translate:1px -3px}29%{translate:0px 0px}33.333333%{translate:-5px 20px}38%{translate:-24px 35px}42%{translate:-33px 42px}44%{translate:-33px 42px}49%{translate:-9px 50px}54%{translate:-2px 50px}100%{translate:-2px 50px}}
