<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 180" role="img" aria-labelledby="title description">
<title id="title">莫莫 · 伸腰续命</title>
<desc id="description">先空手伸懒腰，再从身旁桌上握住杯柄、端起咖啡喝，喝完放回桌上并松手；每段约 2.5 秒，整轮 5 秒。杯子在伸懒腰期间始终放在桌上，拿起和放下时与右手同步，首尾回到相同姿势。</desc>
<style>.stage-0{opacity:1;animation:beat-0 5s step-end infinite}@keyframes beat-0{0%{opacity:1}50%,100%{opacity:0}}
.stage-1{opacity:0;animation:beat-1 5s step-end infinite}@keyframes beat-1{0%{opacity:0}50%{opacity:1}100%{opacity:0}}
.refill-arm,.refill-hand,.refill-cup,.refill-head,.eyes{transform-box:view-box}
.refill-arm-0{animation:refill-arm-0 5s linear infinite}.refill-hand-0{animation:refill-hand-0 5s linear infinite}
@keyframes refill-arm-0{0%{d:path("M63 115 Q46.5 125.5 46 136")}12%{d:path("M63 115 Q34.5 84.5 22 54")}36%{d:path("M63 115 Q34.5 84.5 22 54")}50%{d:path("M63 115 Q46.5 125.5 46 136")}100%{d:path("M63 115 Q46.5 125.5 46 136")}}
@keyframes refill-hand-0{0%{translate:0px 0px}12%{translate:-24px -82px}36%{translate:-24px -82px}50%{translate:0px 0px}100%{translate:0px 0px}}
.refill-arm-1{animation:refill-arm-1 5s linear infinite}.refill-hand-1{animation:refill-hand-1 5s linear infinite}
@keyframes refill-arm-1{0%{d:path("M97 115 Q112 126 111 137")}12%{d:path("M97 115 Q126.5 84 140 53")}36%{d:path("M97 115 Q126.5 84 140 53")}50%{d:path("M97 115 Q129.5 121.5 146 128")}56%{d:path("M97 115 Q129.5 121.5 146 128")}68%{d:path("M97 115 Q111 113 109 111")}82%{d:path("M97 115 Q111 113 109 111")}90%{d:path("M97 115 Q129.5 121.5 146 128")}94%{d:path("M97 115 Q129.5 121.5 146 128")}98%{d:path("M97 115 Q112 126 111 137")}100%{d:path("M97 115 Q112 126 111 137")}}
@keyframes refill-hand-1{0%{translate:0px 0px}12%{translate:29px -84px}36%{translate:29px -84px}50%{translate:35px -9px}56%{translate:35px -9px}68%{translate:-2px -26px}82%{translate:-2px -26px}90%{translate:35px -9px}94%{translate:35px -9px}98%{translate:0px 0px}100%{translate:0px 0px}}
.refill-head{transform-origin:80px 104px;animation:refill-head 5s ease-in-out infinite}
.eyes{transform-origin:80px 78px;animation:refill-blink 5s linear infinite}
.refill-cup{animation:refill-cup 5s linear infinite}
.refill-cup-tilt{transform-box:view-box;transform-origin:0 0;animation:refill-sip 5s ease-in-out infinite}
.refill-steam{animation:refill-steam 5s ease-in-out infinite}
@keyframes refill-cup{0%{translate:0px 0px}56%{translate:0px 0px}68%{translate:-37px -17px}82%{translate:-37px -17px}90%{translate:0px 0px}100%{translate:0px 0px}}
@keyframes refill-head{0%,50%,94%,100%{rotate:0deg}12%,36%{rotate:-4deg}68%,82%{rotate:-3deg}}
@keyframes refill-sip{0%,56%,90%,100%{rotate:0deg}68%,82%{rotate:-10deg}}
@keyframes refill-blink{0%,16%,19%,46%,49%,83%,86%,100%{scale:1 1}17%,18%,47%,48%,84%,85%{scale:1 .15}}
@keyframes refill-steam{0%,50%,100%{opacity:.45}25%,75%{opacity:.8}}
@media(prefers-reduced-motion:reduce){*{animation:none!important}.stage{opacity:0}.stage-0{opacity:1}}
</style>
<g fill="#fffef9" stroke="#242424" stroke-width="4.2" stroke-linejoin="round" stroke-linecap="round" id="body-js">
<path d="M69 145 L65 163 L57 163 M91 145 L95 163 L104 163" fill="none"/><path d="M65 106 Q58 118 60 143 Q60 149 70 148 L91 148 Q101 149 101 140 Q101 119 95 107 Z" /><path d="M63 115 Q46.5 125.5 46 136" class="refill-arm refill-arm-0" fill="none"/><path d="M97 115 Q112 126 111 137" class="refill-arm refill-arm-1" fill="none"/><g class="refill-head"><g class="stage stage-0" aria-label="空手伸懒腰"><path d="M80 30 C106 29 123 47 123 72 C124 97 107 113 80 113 C53 114 36 97 37 72 C36 47 54 29 80 30 Z" /><g id="eyes-js" class="eyes"><path d="M53 78 Q60 83 67 78 M93 78 Q100 83 107 78" fill="none"/><path d="M53 85 L66 86 M94 86 L106 85" fill="none"/></g><g stroke-width="2.8"></g><g stroke-width="3"><path d="M75 98 Q80 100 85 98" fill="none"/></g><path d="M74 38 Q84 31 91 39" fill="none"/></g><g class="stage stage-1" aria-label="从桌上拿起咖啡喝"><path d="M80 30 C106 29 123 47 123 72 C124 97 107 113 80 113 C53 114 36 97 37 72 C36 47 54 29 80 30 Z" /><g class="eyes"><path d="M53 78 Q60 83 67 78 M93 78 Q100 83 107 78" fill="none"/><path d="M53 85 L66 86 M94 86 L106 85" fill="none"/></g><g stroke-width="2.8"></g><g stroke-width="3"><path d="M75 98 Q80 100 85 98" fill="none"/></g><path d="M74 38 Q84 31 91 39" fill="none"/></g></g><g class="refill-table" stroke-width="2.6" aria-label="放咖啡的小桌子"><rect x="111" y="140" width="44" height="4" rx="2"/><path d="M116 145 V166 M151 145 V166 M116 158 H151" fill="none"/></g><g class="refill-cup" transform="translate(146 128)" stroke-width="2.7" aria-label="从桌上拿起并放回的咖啡杯"><g class="refill-cup-tilt"><path d="M-27 -14 H-7 L-9 8 Q-17 14 -25 8 Z" /><path d="M-7 -9 Q6 -12 6 -2 Q5 6 -8 4" fill="none"/><ellipse cx="-17" cy="-11" rx="7.5" ry="2" fill="#6b4a34" stroke-width="1.2"/><g class="refill-steam" stroke-width="1.8"><path d="M-22 -20 Q-27 -26 -21 -33 M-13 -20 Q-18 -27 -12 -35" fill="none"/></g></g></g><g class="refill-hand refill-hand-0"><g class="juggle-hand" transform="translate(46 136) scale(1 1)" stroke-width="3.2"><path d="M-5 1 Q-8 -4 -4 -6 Q-1 -7 0 -3 Q3 -6 6 -3 Q9 1 5 5 Q0 8 -4 5 Z" /><g stroke-width="1.6"><path d="M-2 2 Q1 0 4 2" fill="none"/></g></g></g><g class="refill-hand refill-hand-1"><g class="juggle-hand" transform="translate(111 137) scale(-1 1)" stroke-width="3.2"><path d="M-5 1 Q-8 -4 -4 -6 Q-1 -7 0 -3 Q3 -6 6 -3 Q9 1 5 5 Q0 8 -4 5 Z" /><g stroke-width="1.6"><path d="M-2 2 Q1 0 4 2" fill="none"/></g></g></g>
</g>
</svg>
