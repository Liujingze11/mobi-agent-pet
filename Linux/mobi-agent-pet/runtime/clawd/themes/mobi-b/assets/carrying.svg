<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 180" role="img" aria-labelledby="title description">
<title id="title">莫莫 · 小步搬砖</title>
<desc id="description">双手抱住两块叠放的红砖，从中间走向左侧，再走到右侧并返回中间；位置、脚步和表情在循环首尾一致，可以连续播放；完整循环 5 秒。</desc>
<style>.stage-0{opacity:1;animation:beat-0 5s linear infinite}@keyframes beat-0{0%,24.99%{opacity:1}25%,99.99%{opacity:0}100%{opacity:1}}
.stage-1{opacity:0;animation:beat-1 5s linear infinite}@keyframes beat-1{0%,24.99%{opacity:0}25%,49.99%{opacity:1}50%,100%{opacity:0}}
.stage-2{opacity:0;animation:beat-2 5s linear infinite}@keyframes beat-2{0%,49.99%{opacity:0}50%,74.99%{opacity:1}75%,100%{opacity:0}}
.stage-3{opacity:0;animation:beat-3 5s linear infinite}@keyframes beat-3{0%,74.99%{opacity:0}75%,99.99%{opacity:1}100%,100%{opacity:0}}
.brick-route{animation:carry-route 5s linear infinite}
.brick-carrier{animation:carry-bob 5s ease-in-out infinite}
.brick-leg,.eyes{transform-box:view-box}
.brick-leg-left{transform-origin:69px 145px;animation:carry-left-step 5s ease-in-out infinite}
.brick-leg-right{transform-origin:91px 145px;animation:carry-right-step 5s ease-in-out infinite}
.eyes{transform-origin:80px 78px;animation:carry-blink 5s linear infinite}
@keyframes carry-route{0%,50%,100%{translate:0 0}25%{translate:-24px 0}75%{translate:24px 0}}
@keyframes carry-bob{0%,12.5%,25%,37.5%,50%,62.5%,75%,87.5%,100%{translate:0 0}6.25%,18.75%,31.25%,43.75%,56.25%,68.75%,81.25%,93.75%{translate:0 -1.8px}}
@keyframes carry-left-step{0%,12.5%,25%,37.5%,50%,62.5%,75%,87.5%,100%{rotate:0deg}6.25%,31.25%,56.25%,81.25%{rotate:-10deg}18.75%,43.75%,68.75%,93.75%{rotate:10deg}}
@keyframes carry-right-step{0%,12.5%,25%,37.5%,50%,62.5%,75%,87.5%,100%{rotate:0deg}6.25%,31.25%,56.25%,81.25%{rotate:10deg}18.75%,43.75%,68.75%,93.75%{rotate:-10deg}}
@keyframes carry-blink{0%,18%,21%,43%,46%,68%,71%,93%,96%,100%{scale:1 1}19%,20%,44%,45%,69%,70%,94%,95%{scale:1 .12}}
@media(prefers-reduced-motion:reduce){.stage{animation:none;opacity:0}.stage-3{opacity:1}.brick-route,.brick-carrier,.brick-leg,.eyes{animation:none}}
</style>
<g fill="#fffef9" stroke="#242424" stroke-width="4.2" stroke-linejoin="round" stroke-linecap="round" id="body-js">
<g class="brick-route"><g class="brick-carrier"><g class="brick-leg brick-leg-left"><path d="M69 145 L65 163 L57 163" fill="none"/></g><g class="brick-leg brick-leg-right"><path d="M91 145 L95 163 L104 163" fill="none"/></g><path d="M65 106 Q58 118 60 143 Q60 149 70 148 L91 148 Q101 149 101 140 Q101 119 95 107 Z" /><g class="stage stage-0" aria-label="抱起两块砖头"><path d="M80 30 C106 29 123 47 123 72 C124 97 107 113 80 113 C53 114 36 97 37 72 C36 47 54 29 80 30 Z" /><g id="eyes-js" class="eyes"><path d="M53 78 Q60 83 67 78 M93 78 Q100 83 107 78" fill="none"/><path d="M53 85 L66 86 M94 86 L106 85" fill="none"/></g><g stroke-width="2.8"></g><g stroke-width="3"><path d="M75 98 Q80 100 85 98" fill="none"/></g><path d="M74 38 Q84 31 91 39" fill="none"/></g>
<g class="stage stage-1" aria-label="小步搬砖"><path d="M80 30 C106 29 123 47 123 72 C124 97 107 113 80 113 C53 114 36 97 37 72 C36 47 54 29 80 30 Z" /><g class="eyes"><path d="M53 78 Q60 83 67 78 M93 78 Q100 83 107 78" fill="none"/><path d="M53 85 L66 86 M94 86 L106 85" fill="none"/></g><g stroke-width="2.8"></g><g stroke-width="3"><path d="M75 98 Q80 100 85 98" fill="none"/></g><path d="M74 38 Q84 31 91 39" fill="none"/></g>
<g class="stage stage-2" aria-label="稳住砖头继续走"><path d="M80 30 C106 29 123 47 123 72 C124 97 107 113 80 113 C53 114 36 97 37 72 C36 47 54 29 80 30 Z" /><g class="eyes"><circle cx="60" cy="78" r="3.5" fill="#242424" stroke="none"/><circle cx="100" cy="78" r="3.5" fill="#242424" stroke="none"/></g><g stroke-width="2.8"><path d="M52 69 L67 64 M94 64 L108 69" fill="none"/></g><g stroke-width="3"><path d="M73 103 Q80 96 87 103" fill="none"/></g><path d="M74 38 Q84 31 91 39" fill="none"/><path d="M119 84 Q130 97 123 99 Q116 99 119 84 Z" stroke-width="2.3"/></g>
<g class="stage stage-3" aria-label="把砖头稳稳搬过去"><path d="M80 30 C106 29 123 47 123 72 C124 97 107 113 80 113 C53 114 36 97 37 72 C36 47 54 29 80 30 Z" /><g class="eyes"><path d="M53 78 Q60 83 67 78 M93 78 Q100 83 107 78" fill="none"/><path d="M53 85 L66 86 M94 86 L106 85" fill="none"/></g><g stroke-width="2.8"></g><g stroke-width="3"><path d="M75 98 Q80 100 85 98" fill="none"/></g><path d="M74 38 Q84 31 91 39" fill="none"/></g><g class="carry-arm carry-arm-left"><path d="M63 115 Q42 125 49 143" fill="none"/></g><g class="carry-arm carry-arm-right"><path d="M97 115 Q119 125 111 143" fill="none"/></g><g class="brick-stack"><g class="held-brick" stroke-width="2.6"><path d="M48 133 L60 139 V150 L48 144 Z" fill="#c67f69"/><path d="M60 139 H110 V150 H60 Z" fill="#d9947c"/><path d="M48 133 H98 L110 139 H60 Z" fill="#e9b09c"/><path d="M59 135 H65 L69 137 H63 Z" fill="#925947" stroke-width="1.1"/><path d="M74 135 H80 L84 137 H78 Z" fill="#925947" stroke-width="1.1"/><path d="M89 135 H95 L99 137 H93 Z" fill="#925947" stroke-width="1.1"/><g stroke-width="1.2" opacity=".5"><path d="M68 143 L70 144 M96 146 H101" fill="none"/></g></g><g class="held-brick" stroke-width="2.6"><path d="M53 116 L65 122 V133 L53 127 Z" fill="#c67f69"/><path d="M65 122 H115 V133 H65 Z" fill="#d9947c"/><path d="M53 116 H103 L115 122 H65 Z" fill="#e9b09c"/><path d="M64 118 H70 L74 120 H68 Z" fill="#925947" stroke-width="1.1"/><path d="M79 118 H85 L89 120 H83 Z" fill="#925947" stroke-width="1.1"/><path d="M94 118 H100 L104 120 H98 Z" fill="#925947" stroke-width="1.1"/><g stroke-width="1.2" opacity=".5"><path d="M73 126 L75 127 M101 129 H106" fill="none"/></g></g></g><g class="carry-hand carry-hand-left"><g class="juggle-hand" transform="translate(49 143) scale(1 1)" stroke-width="3.2"><path d="M-5 1 Q-8 -4 -4 -6 Q-1 -7 0 -3 Q3 -6 6 -3 Q9 1 5 5 Q0 8 -4 5 Z" /><g stroke-width="1.6"><path d="M-2 2 Q1 0 4 2" fill="none"/></g></g></g><g class="carry-hand carry-hand-right"><g class="juggle-hand" transform="translate(111 143) scale(-1 1)" stroke-width="3.2"><path d="M-5 1 Q-8 -4 -4 -6 Q-1 -7 0 -3 Q3 -6 6 -3 Q9 1 5 5 Q0 8 -4 5 Z" /><g stroke-width="1.6"><path d="M-2 2 Q1 0 4 2" fill="none"/></g></g></g></g></g>
</g>
</svg>
