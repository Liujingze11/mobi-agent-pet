<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 180" role="img" aria-labelledby="title description">
<title id="title">莫莫 · 从疑惑到灵感</title>
<desc id="description">保留原来的角色动作：拿咖啡杯疑惑 3 秒，随后抬手想到办法 3 秒；整轮 6 秒。</desc>
<style>
.actor,.limb,.prop,.accent,.eyes{transform-box:view-box}
.actor{transform-origin:80px 150px;animation:act 6s ease-in-out infinite}
.prop{transform-origin:80px 136px;animation:prop-act 6s ease-in-out infinite}
.accent{animation:accent-act 6s ease-in-out infinite}
.eyes{transform-origin:80px 80px;animation:blink 6s linear infinite}
.thought-question{opacity:1;animation:thought-question 6s linear infinite}
.thought-idea{opacity:0;animation:thought-idea 6s linear infinite}
@keyframes act{0%,25%,50%,75%,100%{translate:0 0}10%,35%,60%,85%{translate:0 -2px}20%,45%,70%,95%{translate:0 1px}}
@keyframes prop-act{0%,25%,50%,75%,100%{translate:0 0}12%,37%,62%,87%{translate:0 -2px}22%,47%,72%,97%{translate:1px 1px}}
@keyframes accent-act{0%,25%,50%,75%,100%{opacity:.7}8%,33%,58%,83%{opacity:1}18%,43%,68%,93%{opacity:.6}}
@keyframes blink{0%,18%,21%,43%,46%,68%,71%,93%,96%,100%{scale:1 1}19%,20%,44%,45%,69%,70%,94%,95%{scale:1 .12}}
@keyframes thought-question{0%,49.99%{opacity:1}50%,99.99%{opacity:0}100%{opacity:1}}
@keyframes thought-idea{0%,49.99%{opacity:0}50%,99.99%{opacity:1}100%{opacity:0}}
@media(prefers-reduced-motion:reduce){*{animation:none!important}.thought-question{opacity:0}.thought-idea{opacity:1}}
</style>
<g fill="#fffef9" stroke="#242424" stroke-width="4.2" stroke-linejoin="round" stroke-linecap="round" id="body-js">
<g class="stage thought-question" aria-label="问号"><g class="actor pose-inspect" transform="rotate(-5 80 140)"><path d="M69 145 L65 163 L57 163 M91 145 L95 163 L104 163" fill="none"/><path d="M65 106 Q58 118 60 143 Q60 149 70 148 L91 148 Q101 149 101 140 Q101 119 95 107 Z" /><g class="limb limb-0"><path d="M63 115 Q52.5 120.5 58 126" fill="none"/><ellipse cx="58" cy="126" rx="5" ry="5.5"/></g><g class="limb limb-1"><path d="M97 115 Q106 107 99 99" fill="none"/><ellipse cx="99" cy="99" rx="5" ry="5.5"/></g><g class="head-pose" transform=" rotate(2 80 104)"><path d="M80 30 C106 29 123 47 123 72 C124 97 107 113 80 113 C53 114 36 97 37 72 C36 47 54 29 80 30 Z" /><g class="eyes"><circle cx="60" cy="78" r="3.5" fill="#242424" stroke="none"/><circle cx="100" cy="78" r="3.5" fill="#242424" stroke="none"/></g><g stroke-width="2.8"><path d="M52 69 L67 64 M94 64 L108 69" fill="none"/></g><g stroke-width="3"><path d="M73 103 Q80 96 87 103" fill="none"/></g><path d="M74 38 Q84 31 91 39" fill="none"/><path d="M119 84 Q130 97 123 99 Q116 99 119 84 Z" stroke-width="2.3"/></g><ellipse cx="58" cy="126" rx="5" ry="5.5"/><ellipse cx="99" cy="99" rx="5" ry="5.5"/></g><g class="prop prop-cup" transform="  rotate(0 80 136)"><path d="M99 113 H120 L118 139 Q108 145 101 137 Z" /><path d="M120 117 Q133 116 129 128 Q126 132 120 128" fill="none"/><path d="M101 118 H119" fill="none"/></g><g class="accent accent-question" stroke-width="2.6"><path d="M129 24 Q129 16 136 18 Q146 21 135 30 V33" fill="none"/><circle cx="135" cy="39" r="1.8" fill="#242424" stroke="none"/></g></g>
<g class="stage thought-idea" aria-label="灯泡"><g class="actor pose-point" transform="rotate(-5 80 145)"><path d="M69 145 L65 163 L57 163 M91 145 L95 163 L104 163" fill="none"/><path d="M65 106 Q58 118 60 143 Q60 149 70 148 L91 148 Q101 149 101 140 Q101 119 95 107 Z" /><g class="limb limb-0"><path d="M63 115 Q44.5 123.5 42 132" fill="none"/><ellipse cx="42" cy="132" rx="5" ry="5.5"/></g><g class="limb limb-1"><path d="M97 115 Q118.5 95.5 124 76" fill="none"/><ellipse cx="124" cy="76" rx="5" ry="5.5"/></g><g class="head-pose" transform=" rotate(-1 80 104)"><path d="M80 30 C106 29 123 47 123 72 C124 97 107 113 80 113 C53 114 36 97 37 72 C36 47 54 29 80 30 Z" /><g class="eyes"><circle cx="60" cy="78" r="3.5" fill="#242424" stroke="none"/><circle cx="100" cy="78" r="3.5" fill="#242424" stroke="none"/></g><g stroke-width="2.8"></g><g stroke-width="3"><path d="M75 98 Q80 100 85 98" fill="none"/></g><path d="M74 38 Q84 31 91 39" fill="none"/></g><ellipse cx="42" cy="132" rx="5" ry="5.5"/><ellipse cx="124" cy="76" rx="5" ry="5.5"/></g><g class="prop prop-cup" transform="  rotate(0 80 136)"><path d="M99 113 H120 L118 139 Q108 145 101 137 Z" /><path d="M120 117 Q133 116 129 128 Q126 132 120 128" fill="none"/><path d="M101 118 H119" fill="none"/></g><g class="accent accent-idea" stroke-width="2.6"><circle cx="135" cy="25" r="9"/><path d="M130 34 H140 M132 39 H138 M135 8 V3 M120 15 L115 12 M148 15 L153 12" fill="none"/></g></g>
</g>
</svg>
