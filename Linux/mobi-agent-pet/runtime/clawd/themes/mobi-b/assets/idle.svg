<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 180" role="img" aria-labelledby="title description">
<title id="title">莫莫 · 倒咖啡再慢慢喝</title>
<desc id="description">先用咖啡壶往杯里倒咖啡，再拿起杯子喝。每段 5 秒，整轮 10 秒。</desc>
<defs><clipPath id="coffee-cup-clip"><path d="M65 137 H88 L85 155 Q76 160 68 154 Z"/></clipPath></defs>
<style>
.coffee-body,.coffee-cup,.coffee-pot,.coffee-fill,.eyes{transform-box:view-box}
.coffee-body{animation:coffee-breathe 10s ease-in-out infinite}
.coffee-cup{transform-origin:76px 137px;animation:coffee-drink 10s ease-in-out infinite}
.coffee-pot{transform-origin:143px 124px;animation:coffee-pour 10s ease-in-out infinite}
.coffee-fill{transform-origin:76px 158px;animation:coffee-fill 10s linear infinite}
.coffee-stream{animation:coffee-stream 10s linear infinite}
.coffee-left-arm{animation:coffee-left-arm 10s ease-in-out infinite}
.coffee-right-arm{animation:coffee-right-arm 10s ease-in-out infinite}
.eyes{transform-origin:80px 78px;animation:coffee-blink 10s linear infinite}
@keyframes coffee-breathe{0%,50%,100%{translate:0 0}25%,75%{translate:0 -1px}}
@keyframes coffee-pour{0%,50%,100%{translate:0 0;rotate:0deg}10%,42%{translate:0 0;rotate:-22deg}58%,90%{translate:4px 14px;rotate:0deg}}
@keyframes coffee-drink{0%,50%,100%{translate:0 0;rotate:0deg}60%,84%{translate:7px -37px;rotate:-12deg}96%{translate:0 0;rotate:0deg}}
@keyframes coffee-stream{0%,8%,44%,100%{opacity:0}12%,40%{opacity:1}}
@keyframes coffee-fill{0%,8%,96%,100%{scale:1 .05}44%,58%{scale:1 .85}84%{scale:1 .08}}
@keyframes coffee-left-arm{0%,50%,96%,100%{d:path("M63 115 Q47 127 56 146")}60%,84%{d:path("M63 115 Q47 123 64 113")}}
@keyframes coffee-right-arm{0%,50%,100%{d:path("M97 115 Q120 140 143 124")}58%,90%{d:path("M97 115 Q125 146 147 138")}}
@keyframes coffee-blink{0%,18%,21%,70%,73%,100%{scale:1 1}19%,20%,71%,72%{scale:1 .18}}
@media(prefers-reduced-motion:reduce){*{animation:none!important}.coffee-stream{opacity:0}.coffee-fill{scale:1 .5}}
</style>
<g fill="#fffef9" stroke="#242424" stroke-width="4.2" stroke-linejoin="round" stroke-linecap="round" id="body-js">
<g class="coffee-body">
<path d="M69 145 L65 163 L57 163 M91 145 L95 163 L104 163" fill="none"/><path d="M65 106 Q58 118 60 143 Q60 149 70 148 L91 148 Q101 149 101 140 Q101 119 95 107 Z" /><g class="coffee-head"><path d="M80 30 C106 29 123 47 123 72 C124 97 107 113 80 113 C53 114 36 97 37 72 C36 47 54 29 80 30 Z" /><g id="eyes-js" class="eyes"><path d="M53 78 Q60 83 67 78 M93 78 Q100 83 107 78" fill="none"/><path d="M53 85 L66 86 M94 86 L106 85" fill="none"/></g><g stroke-width="2.8"></g><g stroke-width="3"><path d="M75 98 Q80 100 85 98" fill="none"/></g><path d="M74 38 Q84 31 91 39" fill="none"/></g>
<path class="coffee-left-arm" d="M63 115 Q47 127 56 146" fill="none"/>
<path class="coffee-right-arm" d="M97 115 Q120 140 143 124" fill="none"/>
<g class="coffee-cup" aria-label="咖啡杯"><path d="M65 137 H88 L85 155 Q76 160 68 154 Z" /><g clip-path="url(#coffee-cup-clip)"><rect class="coffee-fill" x="65" y="137" width="23" height="21" fill="#6b4a34" stroke="none"/></g><path d="M65 137 H88 L85 155 Q76 160 68 154 Z" fill="none"/><path d="M65 141 Q53 138 53 147 Q54 152 67 149" fill="none"/><g class="coffee-steam" stroke-width="2.1" opacity=".5"><path d="M73 131 Q68 125 73 120 M82 130 Q77 124 82 118" fill="none"/></g><ellipse cx="56" cy="146" rx="5" ry="5.5"/></g>
<g class="coffee-pot" aria-label="咖啡壶"><path d="M111 105 Q122 101 135 105 L137 132 Q124 142 112 132 Z" /><path d="M112 109 L95 102 L97 110 L113 120" /><path d="M136 112 Q152 110 152 122 Q152 134 137 130" fill="none"/><path d="M114 103 Q124 97 133 103 M124 99 V94 M117 126 Q125 129 133 126" fill="none"/><ellipse cx="143" cy="124" rx="5" ry="5.5"/></g>
<path class="coffee-stream" d="M90.4 121.6 Q90 128 76.5 139" fill="none" stroke="#6b4a34" stroke-width="3.2" opacity="0"/>
</g>
</g>
</svg>
