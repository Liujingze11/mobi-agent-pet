<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 180" role="img" aria-labelledby="title description">
<title id="title">莫莫 · 握住扫帚清扫纸屑</title>
<desc id="description">双手握住扫帚，快速扫两下，将纸屑扫出画面右侧，最后展示干净的地面；完整循环 3 秒。</desc>
<style>.stage-0{opacity:1;animation:beat-0 3s linear infinite}@keyframes beat-0{0%,24.99%{opacity:1}25%,99.99%{opacity:0}100%{opacity:1}}
.stage-1{opacity:0;animation:beat-1 3s linear infinite}@keyframes beat-1{0%,24.99%{opacity:0}25%,49.99%{opacity:1}50%,100%{opacity:0}}
.stage-2{opacity:0;animation:beat-2 3s linear infinite}@keyframes beat-2{0%,49.99%{opacity:0}50%,74.99%{opacity:1}75%,100%{opacity:0}}
.stage-3{opacity:0;animation:beat-3 3s linear infinite}@keyframes beat-3{0%,74.99%{opacity:0}75%,99.99%{opacity:1}100%,100%{opacity:0}}
.eyes{transform-box:view-box;transform-origin:80px 78px;translate:3px 3px;animation:sweep-blink 3s linear infinite}
.stage-3 .eyes{translate:1px 1px}
.sweep-rig{animation:sweep-slide 3s linear infinite}
.sweep-arm{transform-box:view-box}
.sweep-arm-right{transform-origin:79px 115px;animation:sweep-right 3s linear infinite}
.sweep-arm-left{transform-origin:45px 115px;animation:sweep-left 3s linear infinite}
.floor-trash{transform-box:view-box}
.clean-spark{animation:clean-floor 3s linear infinite}
.trash-0{animation:trash-0 3s linear infinite}@keyframes trash-0{0%,5%{translate:0 0}18%{translate:38px 0}25%,99.99%{translate:74px 0}100%{translate:0 0}}
.trash-1{animation:trash-1 3s linear infinite}@keyframes trash-1{0%,8.421052631578947%{translate:0 0}18%{translate:28px 0}25%,99.99%{translate:64px 0}100%{translate:0 0}}
.trash-2{animation:trash-2 3s linear infinite}@keyframes trash-2{0%,12.184210526315791%{translate:0 0}18%,38%{translate:17px 0}45%,99.99%{translate:53px 0}100%{translate:0 0}}
.trash-3{animation:trash-3 3s linear infinite}@keyframes trash-3{0%,14.578947368421051%{translate:0 0}18%,38%{translate:10px 0}45%,99.99%{translate:46px 0}100%{translate:0 0}}
@keyframes sweep-slide{0%{translate:-24px 0}5%{translate:-24px 0}18%{translate:14px 0}25%{translate:-24px 0}38%{translate:14px 0}48%{translate:-12px 0}99.99%{translate:-12px 0}100%{translate:-24px 0}}
@keyframes sweep-right{0%{scale:0.1111111111111111 1}5%{scale:0.1111111111111111 1}18%{scale:1.5185185185185186 1}25%{scale:0.1111111111111111 1}38%{scale:1.5185185185185186 1}48%{scale:0.5555555555555556 1}99.99%{scale:0.5555555555555556 1}100%{scale:0.1111111111111111 1}}
@keyframes sweep-left{0%{scale:0.6363636363636364 1}5%{scale:0.6363636363636364 1}18%{scale:1.2121212121212122 1}25%{scale:0.6363636363636364 1}38%{scale:1.2121212121212122 1}48%{scale:0.8181818181818182 1}99.99%{scale:0.8181818181818182 1}100%{scale:0.6363636363636364 1}}
@keyframes sweep-blink{0%,18%,21%,43%,46%,68%,71%,93%,96%,100%{scale:1 1}19%,20%,44%,45%,69%,70%,94%,95%{scale:1 .12}}
@keyframes clean-floor{0%,47.99%,100%{opacity:0}48%,99.99%{opacity:1}}
@media(prefers-reduced-motion:reduce){.stage{animation:none;opacity:0}.stage-3{opacity:1}.eyes{animation:none}.sweep-rig{animation:none;translate:-12px 0}.sweep-arm-right{animation:none;scale:0.5555555555555556 1}.sweep-arm-left{animation:none;scale:0.8181818181818182 1}.floor-trash{animation:none;opacity:0}.clean-spark{animation:none;opacity:1}}
</style>
<defs><clipPath id="sweeping-frame"><rect x="0" y="0" width="160" height="180"/></clipPath></defs>
<g fill="#fffef9" stroke="#242424" stroke-width="4.2" stroke-linejoin="round" stroke-linecap="round" id="body-js">
<g class="sweep-floor" stroke-width="1.3" opacity=".35"><path d="M18 167 H154" fill="none"/></g>
<g class="sweeping-actor" transform="translate(-18 0)"><path d="M69 145 L65 163 L57 163 M91 145 L95 163 L104 163" fill="none"/><path d="M65 106 Q58 118 60 143 Q60 149 70 148 L91 148 Q101 149 101 140 Q101 119 95 107 Z" /><g class="stage stage-0" aria-label="发现地上的纸屑"><path d="M80 30 C106 29 123 47 123 72 C124 97 107 113 80 113 C53 114 36 97 37 72 C36 47 54 29 80 30 Z" /><g id="eyes-js" class="eyes"><path d="M53 78 Q60 83 67 78 M93 78 Q100 83 107 78" fill="none"/><path d="M53 85 L66 86 M94 86 L106 85" fill="none"/></g><g stroke-width="2.8"></g><g stroke-width="3"><path d="M75 98 Q80 100 85 98" fill="none"/></g><path d="M74 38 Q84 31 91 39" fill="none"/></g>
<g class="stage stage-1" aria-label="双手握住扫帚快速清扫"><path d="M80 30 C106 29 123 47 123 72 C124 97 107 113 80 113 C53 114 36 97 37 72 C36 47 54 29 80 30 Z" /><g class="eyes"><path d="M53 78 Q60 83 67 78 M93 78 Q100 83 107 78" fill="none"/><path d="M53 85 L66 86 M94 86 L106 85" fill="none"/></g><g stroke-width="2.8"></g><g stroke-width="3"><path d="M75 98 Q80 100 85 98" fill="none"/></g><path d="M74 38 Q84 31 91 39" fill="none"/></g>
<g class="stage stage-2" aria-label="检查地面"><path d="M80 30 C106 29 123 47 123 72 C124 97 107 113 80 113 C53 114 36 97 37 72 C36 47 54 29 80 30 Z" /><g class="eyes"><circle cx="60" cy="78" r="3.5" fill="#242424" stroke="none"/><circle cx="100" cy="78" r="3.5" fill="#242424" stroke="none"/></g><g stroke-width="2.8"><path d="M52 69 L67 64 M94 64 L108 69" fill="none"/></g><g stroke-width="3"><path d="M73 103 Q80 96 87 103" fill="none"/></g><path d="M74 38 Q84 31 91 39" fill="none"/><path d="M119 84 Q130 97 123 99 Q116 99 119 84 Z" stroke-width="2.3"/></g>
<g class="stage stage-3" aria-label="地面已经扫干净"><path d="M80 30 C106 29 123 47 123 72 C124 97 107 113 80 113 C53 114 36 97 37 72 C36 47 54 29 80 30 Z" /><g class="eyes"><path d="M53 78 Q60 83 67 78 M93 78 Q100 83 107 78" fill="none"/><path d="M53 85 L66 86 M94 86 L106 85" fill="none"/></g><g stroke-width="2.8"></g><g stroke-width="3"><path d="M75 98 Q80 100 85 98" fill="none"/></g><path d="M74 38 Q84 31 91 39" fill="none"/></g></g><g class="sweeping-trash" clip-path="url(#sweeping-frame)"><g class="floor-trash trash-0" transform="translate(106 163)" stroke-width="1.5"><path d="M-4 -3 L-1 -6 L4 -3 L3 2 L-2 3 Z" /><path d="M-1 -6 L0 -1 L3 2 M-4 -3 L0 -1" fill="none"/></g><g class="floor-trash trash-1" transform="translate(116 163)" stroke-width="1.5"><path d="M-3 -5 H2 L5 -2 V2 H-3 Z" /><path d="M2 -5 V-2 H5 M-1 -1 H2" fill="none"/></g><g class="floor-trash trash-2" transform="translate(127 163)" stroke-width="1.5"><path d="M-3 -3 L0 -5 L4 -1 L2 2 L-2 2 Z" /><path d="M0 -5 L-1 0 L2 2" fill="none"/></g><g class="floor-trash trash-3" transform="translate(134 163)" stroke-width="1.5"><circle cx="-2" cy="0" r="1.5" fill="#242424" stroke="none"/><circle cx="2" cy="-2" r="1.2" fill="#242424" stroke="none"/></g></g><g class="sweep-arm sweep-arm-left"><path d="M45 115 Q48 134 111 136.2" fill="none"/></g><g class="sweep-arm sweep-arm-right"><path d="M79 115 Q94 116 106 125.2" fill="none"/></g><g class="sweep-rig"><g class="held-broom"><path d="M100 112 L120 156" fill="none"/><g class="broom-brush" stroke-width="2.6"><path d="M114 153 H124 L130 165 H112 Z" /><g stroke-width="1.4"><path d="M117 157 L115 165 M121 157 V165 M125 157 L127 165" fill="none"/></g></g></g><g class="sweep-hand sweep-hand-right"><g class="juggle-hand" transform="translate(106 125.2) scale(-1 1)" stroke-width="3.2"><path d="M-5 1 Q-8 -4 -4 -6 Q-1 -7 0 -3 Q3 -6 6 -3 Q9 1 5 5 Q0 8 -4 5 Z" /><g stroke-width="1.6"><path d="M-2 2 Q1 0 4 2" fill="none"/></g></g></g><g class="sweep-hand sweep-hand-left"><g class="juggle-hand" transform="translate(111 136.2) scale(1 1)" stroke-width="3.2"><path d="M-5 1 Q-8 -4 -4 -6 Q-1 -7 0 -3 Q3 -6 6 -3 Q9 1 5 5 Q0 8 -4 5 Z" /><g stroke-width="1.6"><path d="M-2 2 Q1 0 4 2" fill="none"/></g></g></g></g><g class="clean-spark" stroke-width="1.7"><path d="M105 157 V163 M102 160 H108 M117 154 V158 M115 156 H119" fill="none"/></g>
</g>
</svg>
