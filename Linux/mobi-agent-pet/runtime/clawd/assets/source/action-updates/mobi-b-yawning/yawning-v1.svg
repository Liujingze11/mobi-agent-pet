<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 180" role="img" aria-labelledby="title description">
<title id="title">莫莫 · 哈欠续命</title>
<desc id="description">先打哈欠，再举起双臂伸懒腰，最后抬起右手的杯子喝咖啡；每段约 2.5 秒，整轮 7.5 秒。杯子全程握在右手，喝完放回腰侧。</desc>
<style>.stage-0{opacity:1;animation:beat-0 7.5s step-end infinite}@keyframes beat-0{0%{opacity:1}33.333333%,100%{opacity:0}}
.stage-1{opacity:0;animation:beat-1 7.5s step-end infinite}@keyframes beat-1{0%{opacity:0}33.333333%{opacity:1}66.666666%{opacity:0}100%{opacity:0}}
.stage-2{opacity:0;animation:beat-2 7.5s step-end infinite}@keyframes beat-2{0%{opacity:0}66.666666%{opacity:1}100%{opacity:0}}
.refill-arm,.refill-hand,.refill-head,.eyes{transform-box:view-box}
.refill-arm-0{animation:refill-arm-0 7.5s linear infinite}.refill-hand-0{animation:refill-hand-0 7.5s linear infinite}
@keyframes refill-arm-0{0%{d:path("M63 115 Q58.5 116 70 117")}6%{d:path("M63 115 Q60.5 113 74 111")}12%{d:path("M63 115 Q61 111.5 75 108")}27%{d:path("M63 115 Q61 111.5 75 108")}33.333333%{d:path("M63 115 Q58.5 115 70 115")}42%{d:path("M63 115 Q34.5 84.5 22 54")}57%{d:path("M63 115 Q34.5 84.5 22 54")}66.666666%{d:path("M63 115 Q46.5 125.5 46 136")}92%{d:path("M63 115 Q46.5 125.5 46 136")}100%{d:path("M63 115 Q58.5 116 70 117")}}
@keyframes refill-hand-0{0%{translate:0px 0px}6%{translate:4px -6px}12%{translate:5px -9px}27%{translate:5px -9px}33.333333%{translate:0px -2px}42%{translate:-48px -63px}57%{translate:-48px -63px}66.666666%{translate:-24px 19px}92%{translate:-24px 19px}100%{translate:0px 0px}}
.refill-arm-1{animation:refill-arm-1 7.5s linear infinite}.refill-hand-1{animation:refill-hand-1 7.5s linear infinite}
@keyframes refill-arm-1{0%{d:path("M97 115 Q116 126.5 119 138")}33.333333%{d:path("M97 115 Q116 126.5 119 138")}42%{d:path("M97 115 Q129.5 84 146 53")}57%{d:path("M97 115 Q129.5 84 146 53")}66.666666%{d:path("M97 115 Q116 126.5 119 138")}77%{d:path("M97 115 Q111 113 109 111")}89%{d:path("M97 115 Q111 113 109 111")}93%{d:path("M97 115 Q112 114.5 111 114")}100%{d:path("M97 115 Q116 126.5 119 138")}}
@keyframes refill-hand-1{0%{translate:0px 0px}33.333333%{translate:0px 0px}42%{translate:27px -85px}57%{translate:27px -85px}66.666666%{translate:0px 0px}77%{translate:-10px -27px}89%{translate:-10px -27px}93%{translate:-8px -24px}100%{translate:0px 0px}}
.refill-head{transform-origin:80px 104px;animation:refill-head 7.5s ease-in-out infinite}
.eyes{transform-origin:80px 78px;animation:refill-blink 7.5s linear infinite}
.refill-cup-tilt{transform-box:view-box;transform-origin:0 0;animation:refill-sip 7.5s ease-in-out infinite}
.refill-steam{animation:refill-steam 7.5s ease-in-out infinite}
@keyframes refill-head{0%,27%,66.666666%,100%{rotate:0deg}42%,57%{rotate:-4deg}77%,89%{rotate:-3deg}}
@keyframes refill-sip{0%,66.666666%,100%{rotate:0deg}77%,89%{rotate:-10deg}93%{rotate:-6deg}}
@keyframes refill-blink{0%,16%,19%,46%,49%,83%,86%,100%{scale:1 1}17%,18%,47%,48%,84%,85%{scale:1 .15}}
@keyframes refill-steam{0%,33.333333%,66.666666%,100%{opacity:.45}16%,50%,83%{opacity:.8}}
@media(prefers-reduced-motion:reduce){*{animation:none!important}.stage{opacity:0}.stage-0{opacity:1}}
</style>
<g fill="#fffef9" stroke="#242424" stroke-width="4.2" stroke-linejoin="round" stroke-linecap="round" id="body-js">
<path d="M69 145 L65 163 L57 163 M91 145 L95 163 L104 163" fill="none"/><path d="M65 106 Q58 118 60 143 Q60 149 70 148 L91 148 Q101 149 101 140 Q101 119 95 107 Z" /><path d="M63 115 Q58.5 116 70 117" class="refill-arm refill-arm-0" fill="none"/><path d="M97 115 Q116 126.5 119 138" class="refill-arm refill-arm-1" fill="none"/><g class="refill-head"><g class="stage stage-0" aria-label="打哈欠"><path d="M80 30 C106 29 123 47 123 72 C124 97 107 113 80 113 C53 114 36 97 37 72 C36 47 54 29 80 30 Z" /><g id="eyes-js" class="eyes"><path d="M53 78 Q60 83 67 78 M93 78 Q100 83 107 78" fill="none"/></g><g stroke-width="2.8"></g><g stroke-width="3"><ellipse cx="80" cy="98" rx="9" ry="11"/></g><path d="M74 38 Q84 31 91 39" fill="none"/></g><g class="stage stage-1" aria-label="举起双臂伸懒腰"><path d="M80 30 C106 29 123 47 123 72 C124 97 107 113 80 113 C53 114 36 97 37 72 C36 47 54 29 80 30 Z" /><g class="eyes"><path d="M53 78 Q60 83 67 78 M93 78 Q100 83 107 78" fill="none"/></g><g stroke-width="2.8"></g><g stroke-width="3"><ellipse cx="80" cy="98" rx="9" ry="11"/></g><path d="M74 38 Q84 31 91 39" fill="none"/></g><g class="stage stage-2" aria-label="喝咖啡续命"><path d="M80 30 C106 29 123 47 123 72 C124 97 107 113 80 113 C53 114 36 97 37 72 C36 47 54 29 80 30 Z" /><g class="eyes"><circle cx="60" cy="78" r="3.5" fill="#242424" stroke="none"/><circle cx="100" cy="78" r="3.5" fill="#242424" stroke="none"/></g><g stroke-width="2.8"></g><g stroke-width="3"><path d="M75 98 Q80 100 85 98" fill="none"/></g><path d="M74 38 Q84 31 91 39" fill="none"/></g></g><g class="refill-hand refill-hand-0"><g class="juggle-hand" transform="translate(70 117) scale(1 1)" stroke-width="3.2"><path d="M-5 1 Q-8 -4 -4 -6 Q-1 -7 0 -3 Q3 -6 6 -3 Q9 1 5 5 Q0 8 -4 5 Z" /><g stroke-width="1.6"><path d="M-2 2 Q1 0 4 2" fill="none"/></g></g></g><g class="refill-hand refill-hand-1"><g class="refill-cup" transform="translate(119 138)" stroke-width="2.7" aria-label="始终握在右手的咖啡杯"><g class="refill-cup-tilt"><path d="M-27 -14 H-7 L-9 8 Q-17 14 -25 8 Z" /><path d="M-7 -9 Q6 -12 6 -2 Q5 6 -8 4" fill="none"/><ellipse cx="-17" cy="-11" rx="7.5" ry="2" fill="#6b4a34" stroke-width="1.2"/><g class="refill-steam" stroke-width="1.8"><path d="M-22 -20 Q-27 -26 -21 -33 M-13 -20 Q-18 -27 -12 -35" fill="none"/></g></g></g><g class="juggle-hand" transform="translate(119 138) scale(-1 1)" stroke-width="3.2"><path d="M-5 1 Q-8 -4 -4 -6 Q-1 -7 0 -3 Q3 -6 6 -3 Q9 1 5 5 Q0 8 -4 5 Z" /><g stroke-width="1.6"><path d="M-2 2 Q1 0 4 2" fill="none"/></g></g></g>
</g>
</svg>
