<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 180" role="img" aria-labelledby="title description">
<title id="title">莫比 · 拆开纸箱再躺平</title>
<desc id="description">先打开纸箱，把四块箱板沿折痕展开铺平；随后慢慢侧躺到纸板上，一只手垫在头边，另一只手放在身前，安静休息；完整循环 6 秒。</desc>
